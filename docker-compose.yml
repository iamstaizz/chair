services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: chair
      POSTGRES_PASSWORD: chair
      POSTGRES_DB: chair
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/tests:/tests:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: